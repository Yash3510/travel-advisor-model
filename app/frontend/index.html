<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Travel AI — test client</title>
<style>
  :root { --bg:#F4F1EB; --ink:#1f2937; --muted:#6b7280; --accent:#0d9488; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, Manrope, system-ui, sans-serif; background:var(--bg); color:var(--ink); height:100dvh; display:flex; }
  aside { width:300px; background:#fff; border-right:1px solid #e5e7eb; padding:20px; overflow-y:auto; flex-shrink:0; }
  aside h1 { font-size:20px; margin:0 0 4px; }
  aside .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  aside h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:18px 0 8px; }
  .deal { border:1px solid #e5e7eb; border-radius:12px; padding:12px; margin-bottom:8px; background:#fafaf9; cursor:pointer; }
  .deal img { width:100%; height:90px; object-fit:cover; border-radius:8px; }
  .deal .t { font-weight:600; font-size:13px; margin:6px 0 4px; }
  .deal .m { font-size:11px; color:var(--muted); }
  main { flex:1; display:flex; flex-direction:column; max-width:760px; margin:0 auto; padding:16px; }
  #msgs { flex:1; overflow-y:auto; padding:8px 0; }
  .row { display:flex; margin-bottom:12px; }
  .me { justify-content:flex-end; }
  .bubble { max-width:78%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.5; white-space:pre-wrap; }
  .bot .bubble { background:#fff; border:1px solid #e5e7eb; border-top-left-radius:4px; }
  .me .bubble { background:var(--accent); color:#fff; border-top-right-radius:4px; }
  .note { text-align:center; color:var(--muted); font-size:11px; margin:8px 0; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 12px; }
  .chip { border:1px solid var(--accent); color:var(--accent); background:#fff; border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; }
  .chip:hover { background:var(--accent); color:#fff; }
  #bar { display:flex; gap:8px; border-top:1px solid #e5e7eb; padding-top:12px; }
  #bar textarea { flex:1; resize:none; border:1px solid #d1d5db; border-radius:10px; padding:10px 12px; font:inherit; height:44px; max-height:120px; }
  #bar button { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:0 20px; font:inherit; cursor:pointer; }
  #bar button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
  <aside id="side">
    <h1>Trippie</h1>
    <div class="sub">International travel assistant — test client</div>
    <h2>Deals</h2>
    <div id="deals"><div class=" DEVELOPER note">no destination yet</div></div>
  </aside>
  <main>
    <div id="msgs"></div>
    <div id="chips" class="chips"></div>
    <div id="bar">
      <textarea id="input" placeholder="Where do you want to go?" autofocus></textarea>
      <button id="send">Send</button>
    </div>
    <div class="note">Trippie is an AI and is in beta. It can make mistakes</div>
  </main>
<script>
const API = location.origin.replace(/:\d+$/, ':5590');
let sessionId = null, threadId = null;

const GREETING = "Hi! I'm Trippie, your travel assistant. Tell me where you'd like to go, when you're travelling, and who's joining — I'll craft the perfect itinerary for you!";

const msgsEl = document.getElementById('msgs'), inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send'), chipsEl = document.getElementById('chips'), dealsEl = document.getElementById('deals');

function addMsg(role, text) {
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'me' : 'bot');
  const b = document.createElement('div');
  b.className = 'bubble'; b.textContent = text;
  row.appendChild(b); msgsEl.appendChild(row);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return b;
}

// hardcoded chip flows mirroring the reference conversation shape
const CHIP_SETS = [
  { match: /how do you like your days planned|days planned/i, chips: [['🏃 Pack it in!', 'I want a packed pace — see everything, maximize every day'], ['⚖️ Balanced', 'A balanced mix of activities and downtime'], ['🧘 Relaxed', 'A relaxed pace — no rush, plenty of free time']] },
  { match: /hotel vibe|hotel style|stay/i, chips: [['📸 Aesthetic & Instagrammable', 'Hotel style: aesthetic & instagrammable'], ['🛏️ Comfort & Reliable', 'Hotel style: comfort & reliable'], ['🎵 Party-Friendly', 'Hotel style: party-friendly'], ['💰 Budget-Smart', 'Hotel style: budget-smart']] },
];

async function init() {
  const r = await fetch(API + '/api/session', { method: 'POST' }).then(r => r.json());
  sessionId = r.sessionId;
  addMsg('assistant', GREETING);
}
init();

function showChips(set) {
  chipsEl.innerHTML = '';
  if (!set) return;
  for (const [label, value] of set.chips) {
    const c = document.createElement('button');
    c.className = 'chip'; c.textContent = label;
    c.onclick = () => { chipsEl.innerHTML = ''; addUserText(value); };
    chipsEl.appendChild(c);
  }
}

function maybeChips(text) {
  for (const s of CHIP_SETS) if (s.match.test(text)) { showChips(s); return; }
  // fallback: offer standard preference chips on any reply
  showChips({ chips: [['🏃 Packed pace', 'I want a packed pace — see everything, maximize every day'], ['⚖️ Balanced', 'A balanced mix of activities and downtime'], ['🧘 Relaxed', 'A relaxed pace — no rush, plenty of free time'], ['🛏️ Hotel style: aesthetic', 'Hotel style: aesthetic & instagrammable'], ['💵 Hotel style: budget', 'Hotel style: budget-smart']] });
}

function showDeals(deals) {
  dealsEl.innerHTML = '';
  if (!deals?.length) { dealsEl.innerHTML = '<div class="note">no destination yet</div>'; return; }
  for (const d of deals) {
    const div = document.createElement('div');
    div.className = 'deal';
    div.innerHTML = `<img src="${d.image}" onerror="this.style.display='none'"/><div class="t">${d.title}</div>
      <div class="m">${d.nights} nights · ${d.tripType} · ${d.numBookings}+ booked</div>
      <div class="m"><b>₹${d.itineraryCost.toLocaleString('en-IN')}</b>${d.strikedCost ? ` <s>₹${d.strikedCost.toLocaleString('en-IN')}</s>` : ''} / person</div>`;
    div.onclick = () => addUserText(`I'd like the "${d.title}" — plan this trip`);
    dealsEl.appendChild(div);
  }
}

let inFlight = false;
async function addUserText(text) {
  if (inFlight || !text.trim()) return;
  inFlight = true; sendBtn.disabled = true;
  addMsg('user', text);
  const bubble = addMsg('assistant', '');
  bubble.textContent = '…';
  try {
    const res = await fetch(API + '/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, messages: [{ role: 'user', content: text, timestamp: new Date().toISOString() }], threadId }),
    });
    const reader = res.body.getReader(); const dec = new TextDecoder();
    let buf = '', finalMsg = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      // SSE events may arrive whole here (single done event), but parse defensively
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const evLine = block.split('\n').find(l => l.startsWith('event: '));
        const dataLine = block.split('\n').find(l => l.startsWith('data: '));
        if (!evLine || !dataLine) continue;
        const ev = evLine.slice(7).trim(); const data = JSON.parse(dataLine.slice(6));
        if (ev === 'destination_selected') { /* region shown in deals header */ }
        if (ev === 'campaign_deals') showDeals(data.deals);
        if (ev === 'done') { finalMsg = data.message; if (data.threadId) threadId = data.threadId; }
        if (ev === 'error') finalMsg = 'Error: ' + data.message;
      }
    }
    // typewriter reveal (client-side, mirrors reference site)
    bubble.textContent = '';
    for (let i = 0; i <= finalMsg.length; i += 3) { bubble.textContent = finalMsg.slice(0, i); msgsEl.scrollTop = msgsEl.scrollHeight; await new Promise(r => setTimeout(r, 8)); }
    maybeChips(finalMsg);
  } catch (e) {
    bubble.textContent = 'Error: ' + e.message;
  }
  sendBtn.disabled = false; inFlight = false; inputEl.focus();
}

async function send() {
  const text = inputEl.value; inputEl.value = '';
  await addUserText(text);
}
async function confirmBooking() { /* confirm dialog w/ threadId reference */ }

document.getElementById('send').onclick = send;
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
</script>
</body>
</html>
